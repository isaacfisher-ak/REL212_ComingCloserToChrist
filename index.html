        let map, tileLayer, markersMap = {}, arcsLayerGroup;
        let selectedCityId = "ALL", currentAuthorFilter = "All", currentSearchQuery = "", currentSectionView = "both";

        function initMap() {
            map = L.map('map', { center: [37.9061, 22.8806], zoom: 5, minZoom: 4, maxZoom: 10, zoomControl: false });
            L.control.zoom({ position: 'topright' }).addTo(map);

            // Esri Light Gray Canvas tile layer
            tileLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { 
                attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ', 
                maxZoom: 16 
            }).addTo(map);

            arcsLayerGroup = L.layerGroup().addTo(map);
            renderCityMarkers();
            selectCity("ALL", true);

            // ADDED: Click event on the map background to select "ALL"
            map.on('click', function() {
                selectCity("ALL", false);
            });

            const mapContainerEl = document.getElementById('mapColumn');
            if (window.ResizeObserver && mapContainerEl) {
                new ResizeObserver(() => { if (map) map.invalidateSize({ animate: false }); }).observe(mapContainerEl);
            }
            setTimeout(() => map.invalidateSize(), 200);
        }

        function getFilteredBooks() {
            return booksData.filter(book => {
                const matchesAuthor = currentAuthorFilter === "All" || book.author === currentAuthorFilter;
                if (!matchesAuthor) return false;
                if (!currentSearchQuery.trim()) return true;
                const q = currentSearchQuery.toLowerCase();
                return book.title.toLowerCase().includes(q) || book.author.toLowerCase().includes(q) || book.summary.toLowerCase().includes(q) || book.originCity.toLowerCase().includes(q) || book.destinationCity.toLowerCase().includes(q);
            });
        }

        function renderCityMarkers() {
            Object.values(citiesData).forEach(city => {
                const isSelected = selectedCityId === city.id;
                const markerHtml = `<div class="city-marker-wrapper ${isSelected ? 'city-marker-active' : ''}"><div class="city-marker-pin"></div><div class="city-marker-label">${city.shortName}</div></div>`;
                const icon = L.divIcon({ html: markerHtml, className: '', iconSize: [72, 36], iconAnchor: [36, 8] });
                const tooltipContent = `<div><div class="font-semibold text-slate-800">${city.name}</div></div>`;
                if (markersMap[city.id]) { markersMap[city.id].setIcon(icon); markersMap[city.id].setTooltipContent(tooltipContent); }
                else { const marker = L.marker(city.coords, { icon }).addTo(map); marker.bindTooltip(tooltipContent, { direction: 'top', offset: [0, -18], className: 'custom-city-tooltip' }); marker.on('click', () => selectCity(city.id, true)); markersMap[city.id] = marker; }
            });
        }

        function drawCityArcs(cityId) {
            arcsLayerGroup.clearLayers();
            if (!cityId) return;
            const filtered = getFilteredBooks();
            
            const createArc = (lat1, lng1, lat2, lng2, offsetScale) => {
                const midLat = (lat1 + lat2) / 2, midLng = (lng1 + lng2) / 2, dLat = lat2 - lat1, dLng = lng2 - lng1;
                const ctrlLat = midLat - dLng * offsetScale, ctrlLng = midLng + dLat * offsetScale;
                return Array.from({length: 33}, (_, i) => { const t = i/32; return [(1-t)*(1-t)*lat1 + 2*(1-t)*t*ctrlLat + t*t*lat2, (1-t)*(1-t)*lng1 + 2*(1-t)*t*ctrlLng + t*t*lng2]; });
            };

            // ADDED: Draw all arcs faintly when "ALL" is selected
            if (cityId === "ALL") {
                filtered.forEach((book, idx) => {
                    const origin = citiesData[book.originCity], dest = citiesData[book.destinationCity];
                    if (origin && dest && origin.id !== dest.id) L.polyline(createArc(origin.coords[0], origin.coords[1], dest.coords[0], dest.coords[1], 0.15 + (idx % 3) * 0.045), { color: '#94a3b8', weight: 1.5, opacity: 0.5 }).addTo(arcsLayerGroup);
                });
                return;
            }

            if (currentSectionView === 'both' || currentSectionView === 'for') {
                filtered.filter(b => b.destinationCity === cityId).forEach((book, idx) => {
                    const origin = citiesData[book.originCity], dest = citiesData[book.destinationCity];
                    if (origin && dest && origin.id !== dest.id) L.polyline(createArc(origin.coords[0], origin.coords[1], dest.coords[0], dest.coords[1], 0.15 + (idx % 3) * 0.045), { color: '#3b82f6', weight: 2, opacity: 0.7 }).addTo(arcsLayerGroup);
                });
            }
            if (currentSectionView === 'both' || currentSectionView === 'in') {
                filtered.filter(b => b.originCity === cityId).forEach((book, idx) => {
                    const origin = citiesData[book.originCity], dest = citiesData[book.destinationCity];
                    if (origin && dest && origin.id !== dest.id) L.polyline(createArc(origin.coords[0], origin.coords[1], dest.coords[0], dest.coords[1], -0.15 - (idx % 3) * 0.045), { color: '#d97706', weight: 2, opacity: 0.7 }).addTo(arcsLayerGroup);
                });
            }
        }

        function selectCity(cityId, flyToLocation = true) {
            selectedCityId = cityId; 
            
            // ADDED: Logic for handling "ALL" selection
            if (cityId === "ALL") {
                renderCityMarkers(); 
                drawCityArcs("ALL"); 
                renderDetailPanel();
                return;
            }

            const city = citiesData[cityId]; if (!city) return;
            if (flyToLocation && map) map.flyTo(city.coords, 5, { animate: true, duration: 0.8 });
            renderCityMarkers(); drawCityArcs(cityId); renderDetailPanel();
        }

        function resetMapView() { if (map) map.flyTo([37.9061, 22.8806], 5, { animate: true, duration: 1.0 }); drawCityArcs(selectedCityId); }

        function setSectionView(mode) {
            currentSectionView = mode;
            const inactive = "px-2.5 py-1 rounded-md text-xs font-medium text-slate-600 hover:bg-slate-100", active = "px-2.5 py-1 rounded-md text-xs font-semibold bg-slate-800 text-white";
            document.getElementById('tabBoth').className = mode === 'both' ? active : inactive;
            document.getElementById('tabFor').className = mode === 'for' ? active : inactive;
            document.getElementById('tabIn').className = mode === 'in' ? active : inactive;
            
            // ADDED: Keep layout locked if "ALL" is selected
            if (selectedCityId === "ALL") {
                document.getElementById('sectionWrittenFor').style.display = 'block';
                document.getElementById('sectionWrittenIn').style.display = 'none';
                document.getElementById('sectionDivider').style.display = 'none';
            } else {
                document.getElementById('sectionWrittenFor').style.display = (mode === 'both' || mode === 'for') ? 'block' : 'none';
                document.getElementById('sectionWrittenIn').style.display = (mode === 'both' || mode === 'in') ? 'block' : 'none';
                document.getElementById('sectionDivider').style.display = (mode === 'both') ? 'block' : 'none';
            }
            drawCityArcs(selectedCityId);
        }

        function createBookCardHtml(book, roleType) {
            const counterpartCity = (roleType === 'ALL' || roleType === 'FOR') ? book.originCity : book.destinationCity;
            return `
                <article class="border border-slate-200 rounded-lg p-4 space-y-3 shadow-sm hover:shadow-md transition-shadow">
                    <div>
                        <h4 class="font-semibold text-slate-900">${book.title}</h4>
                        <p class="text-xs text-slate-500 mt-0.5 font-medium">${book.author} &middot; ${book.time} &middot; ${book.category}</p>
                        <p class="text-sm text-slate-600 mt-2 leading-relaxed">${book.summary}</p>
                    </div>
                    
                    <p class="text-xs text-slate-500 bg-slate-50 p-2 rounded border border-slate-100">
                        From <strong>${book.originCity}</strong> to <strong>${book.destinationCity}</strong>. 
                        <button onclick="selectCity('${counterpartCity}', true)" class="text-blue-600 font-semibold hover:underline underline-offset-2 ml-1">
                            Go to ${counterpartCity} &rarr;
                        </button>
                    </p>

                    <div class="mt-3 pt-3 border-t border-slate-100">
                        <p class="text-xs font-bold text-navy-800 mb-1">Audience & Context:</p>
                        <p class="text-xs text-slate-600 leading-relaxed">${book.audienceAndPurpose}</p>
                    </div>

                    <div class="mt-2 pt-2 border-t border-dashed border-slate-100">
                        <p class="text-xs font-bold text-navy-800 mb-1">Testimony of Christ:</p>
                        <p class="text-xs text-slate-600 leading-relaxed">${book.christologicalTestimony}</p>
                    </div>
                    
                    <div class="text-sm text-slate-700 space-y-2 pt-3 border-t border-slate-100">
                        <div class="flex items-center justify-between">
                            <p class="text-[10px] font-semibold text-slate-500 uppercase tracking-wide">Key Titles of Christ</p>
                            <p class="text-[10px] font-semibold text-slate-600 bg-slate-100 border border-slate-200 px-2 py-0.5 rounded-full">${book.christTitles.join(', ')}</p>
                        </div>
                        
                        <div class="mt-3 pt-3 border-t border-dashed border-slate-200">
                            <p class="text-xs font-bold text-slate-700 mb-1">Key Verses to Study:</p>
                            <div class="flex flex-wrap gap-2">
                                ${book.keyVerses.map(verse => `<span class="text-xs font-mono bg-amber-50 text-amber-900 border border-amber-200 px-2 py-1 rounded shadow-sm">${verse}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                </article>`;
        }

        function renderDetailPanel() {
            const filtered = getFilteredBooks();
            
            // ADDED: Logic to render "All Books" view
            if (selectedCityId === "ALL") {
                document.getElementById('locationBanner').innerHTML = `<p class="text-xs text-slate-500">Mediterranean Basin</p><h2 class="text-xl font-scholarly font-bold text-slate-900 mt-0.5">All Epistles & Books</h2><p class="text-sm text-slate-600 mt-2 leading-relaxed">Viewing all ${filtered.length} books in the second half of the New Testament.</p>`;
                document.getElementById('countFor').textContent = filtered.length; 
                document.getElementById('countIn').textContent = 0;
                
                document.getElementById('headingWrittenFor').textContent = `All Books`; 
                document.getElementById('badgeCountFor').textContent = filtered.length;
                
                document.getElementById('sectionWrittenIn').style.display = 'none';
                document.getElementById('sectionDivider').style.display = 'none';
                document.getElementById('sectionWrittenFor').style.display = 'block';

                document.getElementById('cardsWrittenFor').innerHTML = filtered.length ? filtered.map(b => createBookCardHtml(b, 'ALL')).join('') : `<p class="text-sm text-slate-500 bg-slate-50 p-3 rounded border border-slate-100">No books found.</p>`;
                return;
            }

            const city = citiesData[selectedCityId]; if (!city) return;
            const booksWrittenFor = filtered.filter(b => b.destinationCity === city.id), booksWrittenIn = filtered.filter(b => b.originCity === city.id);
            
            // Reset tab visibility logic if coming back from "ALL" view
            setSectionView(currentSectionView);

            document.getElementById('locationBanner').innerHTML = `<p class="text-xs text-slate-500">${city.province}</p><h2 class="text-xl font-semibold text-slate-900 mt-0.5">${city.name}</h2><p class="text-sm text-slate-600 mt-2 leading-relaxed">${city.context}</p>`;
            document.getElementById('countFor').textContent = booksWrittenFor.length; document.getElementById('countIn').textContent = booksWrittenIn.length;
            document.getElementById('headingWrittenFor').textContent = `Written for ${city.shortName}`; document.getElementById('badgeCountFor').textContent = booksWrittenFor.length;
            document.getElementById('headingWrittenIn').textContent = `Written in ${city.shortName}`; document.getElementById('badgeCountIn').textContent = booksWrittenIn.length;
            document.getElementById('cardsWrittenFor').innerHTML = booksWrittenFor.length ? booksWrittenFor.map(b => createBookCardHtml(b, 'FOR')).join('') : `<p class="text-sm text-slate-500 bg-slate-50 p-3 rounded border border-slate-100">No epistles were sent specifically to ${city.shortName}.</p>`;
            document.getElementById('cardsWrittenIn').innerHTML = booksWrittenIn.length ? booksWrittenIn.map(b => createBookCardHtml(b, 'IN')).join('') : `<p class="text-sm text-slate-500 bg-slate-50 p-3 rounded border border-slate-100">No epistles were written from ${city.shortName}.</p>`;
        }

        function openAllBooksModal() {
            document.getElementById('allBooksGrid').innerHTML = booksData.map(book => `<div class="border border-slate-200 rounded-lg p-3 flex flex-col justify-between gap-3"><div><p class="text-xs text-slate-400">${book.author} · ${book.time}</p><h3 class="font-semibold text-slate-900 mt-1">${book.title}</h3><p class="text-xs text-slate-500 mt-1 line-clamp-2">${book.summary}</p></div><div class="flex gap-2 text-xs"><button onclick="closeAllBooksModal(); selectCity('${book.originCity}', true);" class="text-slate-600 hover:text-slate-900 underline underline-offset-2">From ${book.originCity}</button><button onclick="closeAllBooksModal(); selectCity('${book.destinationCity}', true);" class="text-slate-600 hover:text-slate-900 underline underline-offset-2">For ${book.destinationCity}</button></div></div>`).join('');
            document.getElementById('allBooksModal').classList.remove('hidden'); document.getElementById('allBooksModal').classList.add('flex');
        }

        function closeAllBooksModal() { document.getElementById('allBooksModal').classList.add('hidden'); document.getElementById('allBooksModal').classList.remove('flex'); }
        function toggleMobilePanel() { document.getElementById('mapColumn').classList.toggle('hidden'); setTimeout(() => map.invalidateSize(), 200); }

        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            document.getElementById('authorSelect').addEventListener('change', (e) => { currentAuthorFilter = e.target.value; renderCityMarkers(); drawCityArcs(selectedCityId); renderDetailPanel(); });
            document.getElementById('globalSearch').addEventListener('input', (e) => { currentSearchQuery = e.target.value; renderCityMarkers(); drawCityArcs(selectedCityId); renderDetailPanel(); });
            window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAllBooksModal(); });
        });
    </script>
</body>
</html>
